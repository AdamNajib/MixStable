[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_stable_mixture"
version = "0.1.1"
description = "Tools for alpha-stable mixture model estimation and simulation"
readme = "README.md"
authors = [
    {name = "Adam Najib"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "streamlit",
    "statsmodels",
    "rpy2"
]

[tool.setuptools.packages.find]
where = ["src"]
